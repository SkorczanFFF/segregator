version: 2
updates:
  # Same 7-day release age as minimumReleaseAge in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Types must match the Node.js 24 runtime of Lambda, CodeBuild and CI.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
